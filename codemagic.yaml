workflows:
  ios-release-ipa:
    name: iOS Unsigned / Release IPA Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup complete iOS project structure and workspace
        script: |
          cd flutter_app
          mkdir -p ios/Runner.xcworkspace
          cat << 'EOF' > ios/Runner.xcworkspace/contents.xcworkspacedata
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace
             version = "1.0">
             <FileRef
                location = "group:Runner.xcodeproj">
             </FileRef>
          </Workspace>
          EOF
          flutter create --platforms=ios .
      - name: Install Flutter packages, launcher icons, and Pods
        script: |
          cd flutter_app
          flutter packages pub get
          dart run flutter_launcher_icons || flutter pub run flutter_launcher_icons || echo "Continuing build..."
          if [ -f "ios/Podfile" ]; then
            cd ios
            pod install || true
            cd ..
          fi
      - name: Flutter build iOS IPA (Unsigned)
        script: |
          cd flutter_app
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -q CalamansiYield.ipa Payload
          echo "Successfully packaged CalamansiYield.ipa"
    artifacts:
      - flutter_app/build/ios/iphoneos/*.ipa
      - flutter_app/build/ios/archive/*.xcarchive
    publishing:
      email:
        recipients:
          - johnpaultiu701@gmail.com
          - johnpaultiu12mate@gmail.com
        notify:
          success: true
          failure: true
