workflows:
  ios-release-ipa:
    name: iOS Unsigned / Release IPA Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate complete iOS project structure if missing
        script: |
          cd flutter_app
          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "Regenerating iOS platform project files..."
            flutter create --platforms=ios .
          fi
      - name: Install Flutter packages and generate App Icons
        script: |
          cd flutter_app
          flutter packages pub get
          dart run flutter_launcher_icons || flutter pub run flutter_launcher_icons || echo "Continuing build..."
      - name: Flutter build iOS IPA (Unsigned)
        script: |
          cd flutter_app
          flutter build ios --release --no-codesign || flutter build ipa --release --no-codesign || true
          mkdir -p build/ios/iphoneos/Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          elif [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/iphoneos/Payload/
          fi
          cd build/ios/iphoneos
          if [ -d "Payload/Runner.app" ]; then
            zip -r -q CalamansiYield.ipa Payload
            echo "Successfully packaged CalamansiYield.ipa"
          else
            echo "Runner.app not found in expected paths, checking directory contents:"
            ls -la
          fi
    artifacts:
      - flutter_app/build/ios/iphoneos/*.ipa
      - flutter_app/build/ios/ipa/*.ipa
      - flutter_app/build/ios/archive/*.xcarchive
    publishing:
      email:
        recipients:
          - johnpaultiu701@gmail.com
          - johnpaultiu12mate@gmail.com
        notify:
          success: true
          failure: true