workflows:
  ios-release-ipa:
    name: iOS Unsigned / Release IPA Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    working_directory: flutter_app
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter build iOS IPA (Unsigned)
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /Users/builder/clone/flutter_app/build/ios/ipa/*.ipa
      - /Users/builder/clone/flutter_app/build/ios/archive/*.xcarchive
    publishing:
      email:
        recipients:
          - johnpaultiu701@gmail.com
        notify:
          success: true
          failure: true

  ios-adhoc-simulator:
    name: iOS Simulator App (Fast Test)
    max_build_duration: 20
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    working_directory: flutter_app
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter build iOS Simulator
        script: |
          flutter build ios --simulator --release
    artifacts:
      - build/ios/iphonesimulator/*.app
    publishing:
      email:
        recipients:
          - johnpaultiu701@gmail.com
        notify:
          success: true
          failure: false
