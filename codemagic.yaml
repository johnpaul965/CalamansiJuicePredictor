workflows:
  ios-release-ipa:
    name: iOS Unsigned / Release IPA Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate complete iOS project structure if missing
        script: |
          cd flutter_app
          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "Regenerating iOS platform project files..."
            flutter create --platforms=ios .
          fi
      - name: Install Flutter packages and generate App Icons
        script: |
          cd flutter_app
          flutter packages pub get
          dart run flutter_launcher_icons
      - name: Flutter build iOS IPA (Unsigned)
        script: |
          cd flutter_app
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r CalamansiYield.ipa Payload
    artifacts:
      - flutter_app/build/ios/iphoneos/CalamansiYield.ipa
    publishing:
      email:
        recipients:
          - johnpaultiu701@gmail.com
          - johnpaultiu12mate@gmail.com
        notify:
          success: true
          failure: true