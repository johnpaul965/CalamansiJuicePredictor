workflows:
  ios-release-ipa:
    name: iOS Unsigned / Release IPA Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate iOS project files if missing
        script: |
          cd flutter_app
          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "Generating iOS platform project files..."
            flutter create --platforms=ios .
          fi
      - name: Install dependencies
        script: |
          cd flutter_app
          flutter packages pub get
      - name: Flutter build iOS IPA (Unsigned)
        script: |
          cd flutter_app
          flutter build ipa --release --no-codesign
    artifacts:
      - flutter_app/build/ios/ipa/*.ipa
      - flutter_app/build/ios/archive/*.xcarchive
      - /Users/builder/clone/flutter_app/build/ios/ipa/*.ipa
      - /Users/builder/clone/flutter_app/build/ios/archive/*.xcarchive
    publishing:
      email:
        recipients:
          - johnpaultiu12mate@gmail.com
          - johnpaultiu701@gmail.com
        notify:
          success: true
          failure: true
